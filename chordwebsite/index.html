<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chord Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>Chord Analyzer</h1>
    <p class="subtitle">Play a chord on piano and we'll identify it.</p>

    <div class="tab-bar" role="tablist">
      <button class="tab-btn active" data-tab="mic" role="tab">🎤 Microphone</button>
      <button class="tab-btn" data-tab="midi" role="tab">🎹 MIDI Keyboard</button>
    </div>

    <div class="accidental-toggle" role="group" aria-label="Accidental preference">
      <button type="button" id="preferSharpBtn" class="toggle-option active">Prefer ♯</button>
      <button type="button" id="preferFlatBtn" class="toggle-option">Prefer ♭</button>
    </div>

    <!-- ── Microphone panel ── -->
    <div id="tab-mic" class="tab-panel active">
      <div class="mic-select-row">
        <label for="micSelect">Microphone:</label>
        <select id="micSelect"></select>
      </div>

      <div class="controls">
        <button id="startBtn" class="btn-primary">Start Listening</button>
        <button id="stopBtn" class="btn-secondary" disabled>Stop</button>
      </div>

      <div class="status-bar">
        <span id="statusText">Click "Start Listening" to begin.</span>
      </div>

      <div class="results" id="results" hidden>
        <div class="chord-name" id="chordName"></div>
        <div class="notes-detected" id="micNotesDetected">
          Detected notes: <span id="notesDetected"></span>
        </div>
        <div id="notation"></div>
        <canvas class="piano-roll" id="micPianoRoll" height="60"></canvas>
      </div>
    </div>

    <!-- ── MIDI panel ── -->
    <div id="tab-midi" class="tab-panel">
      <div class="controls">
        <button id="midiStartBtn" class="btn-primary">Start Analyzing</button>
        <button id="midiStopBtn" class="btn-secondary" disabled>Stop</button>
      </div>

      <div class="mic-select-row" id="midiDeviceRow" style="display:none">
        <label for="midiSelect">MIDI Device:</label>
        <select id="midiSelect"></select>
      </div>

      <div class="status-bar">
        <span id="midiStatusText">Click "Start Analyzing" to begin.</span>
      </div>

      <div class="results" id="midiResults" style="display:none">
        <div class="chord-name" id="midiChordName"></div>
        <div class="notes-detected" id="midiNotesDetected">
          Playing: <span id="midiNotesDisplay"></span>
        </div>
        <div id="midiNotation"></div>
        <canvas class="piano-roll" id="midiPianoRoll" height="60"></canvas>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <script src="pitchDetect.js"></script>
  <script src="chordRecognize.js"></script>
  <script src="notation.js"></script>
  <script src="midiInput.js"></script>
  <script src="app.js"></script>
</body>
</html>
